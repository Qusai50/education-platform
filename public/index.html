<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>المنصة التعليمية</title>
  <style>
    body { font-family: Tahoma, Arial, sans-serif; background: #f4f6f8; margin: 0; }
    .box { max-width: 480px; margin: 40px auto; background: #fff; padding: 24px;
           border-radius: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.08); }
    h1 { margin-top: 0; font-size: 22px; }
    input { width: 100%; padding: 10px; font-size: 16px; box-sizing: border-box;
            border: 1px solid #ccc; border-radius: 8px; }
    button { margin-top: 10px; width: 100%; padding: 10px; font-size: 16px;
             background: #1f6feb; color: #fff; border: 0; border-radius: 8px; cursor: pointer; }
    #msg { margin-top: 10px; min-height: 20px; }
    ul { padding-right: 20px; }
  </style>
</head>
<body>
  <div class="box">
    <h1>تسجيل طالب جديد</h1>
    <input id="name" placeholder="اكتب اسمك هنا" maxlength="100">
    <button id="send">تسجيل</button>
    <div id="msg"></div>

    <h2>الطلاب المسجلون</h2>
    <ul id="list"></ul>
  </div>

  <script src="app.js"></script>
</body>
</html>
